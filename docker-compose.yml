services:
  backend:
    build: ./backend
    container_name: mylittletodo-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Override for container networking if needed
      PORT: 8000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    container_name: mylittletodo-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
